name: Repair branch · Android ARM64 APK
on:
  push:
    branches: [fix/honeydew-midi-ci-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: honeydew-repair-android-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: honeydew-repair-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev clang
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Compile and verify signed Android APK
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108" tools/android-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Honeydew-042-custom-audio-repair-Android-ARM64
          path: target/honeydew-android-*-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7
