name: VocalTune Android debug
on:
  push:
    branches: [feature/vocaltune-v03]
  workflow_dispatch:
concurrency:
  group: vocaltune-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android
      - name: Validate independent VocalTune DSP before Android build
        run: |
          rustc --edition 2024 --test crates/audio/src/vocal_tune.rs -o /tmp/vocaltune-unit
          /tmp/vocaltune-unit
          rustc --edition 2024 --test tools/vocaltune-spectral.rs -o /tmp/vocaltune-spectral
          /tmp/vocaltune-spectral --nocapture
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build signed debug APK with bundled sounds
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108" tools/android-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Honeydew-VocalTune-v0.3-Android-arm64-debug
          path: target/honeydew-android-*-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7
