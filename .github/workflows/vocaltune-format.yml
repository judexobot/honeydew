name: VocalTune format branch
on:
  push:
    branches: [feature/vocaltune-v03]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - name: Apply rustfmt on branch only
        run: |
          rustfmt --edition 2024 --config skip_children=true crates/audio/src/lib.rs crates/audio/src/vocal_tune.rs src/params/mod.rs src/params/vocal_tune.rs src/panels/fx/mod.rs src/panels/fx/vocal_tune.rs src/ui/modules_browser.rs
          git add crates/audio/src/lib.rs crates/audio/src/vocal_tune.rs src/params/mod.rs src/params/vocal_tune.rs src/panels/fx/mod.rs src/panels/fx/vocal_tune.rs src/ui/modules_browser.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: rustfmt VocalTune development branch'
            git push origin HEAD:feature/vocaltune-v03
          fi
